<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 12.0 1168.0 698.0" width="1168" height="698" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-Reversibility_Budget" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><text x="40.00" y="51.30" font-size="17" fill="#0f766e">SORT EVERY LINE BY ONE QUESTION: how fast could I stop this, and what would stopping cost?</text></g>
<g data-beat="1"><rect x="260.00" y="96.00" width="640.00" height="56.00" rx="14.0" ry="14.0" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/></g>
<g data-beat="1"><text x="240.00" y="129.22" font-size="19" fill="#c92a2a" text-anchor="end">COMMITTED</text></g>
<g data-beat="1"><text x="260.00" y="184.40" font-size="16" fill="#4b5563">signed contracts, capacity reservations, deposits, leases, debt service</text></g>
<g data-beat="1"><text x="920.00" y="118.40" font-size="16" fill="#c92a2a"><tspan x="920.00">months → never</tspan><tspan x="920.00" dy="20.00">exiting costs money</tspan></text></g>
<g data-beat="2"><rect x="260.00" y="222.00" width="340.00" height="56.00" rx="14.0" ry="14.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="2"><text x="240.00" y="255.22" font-size="19" fill="#b45309" text-anchor="end">STICKY</text></g>
<g data-beat="2"><text x="260.00" y="310.40" font-size="16" fill="#4b5563">people, programs, factory ramps, half-finished design wins</text></g>
<g data-beat="2"><text x="920.00" y="244.40" font-size="16" fill="#b45309"><tspan x="920.00">a quarter or two</tspan><tspan x="920.00" dy="20.00">exiting destroys something</tspan></text></g>
<g data-beat="3"><rect x="260.00" y="348.00" width="140.00" height="56.00" rx="14.0" ry="14.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="3"><text x="240.00" y="381.23" font-size="19" fill="#0f766e" text-anchor="end">FLEXIBLE</text></g>
<g data-beat="3"><text x="260.00" y="436.40" font-size="16" fill="#4b5563">campaigns, travel, contractors, buybacks, optional projects</text></g>
<g data-beat="3"><text x="920.00" y="380.40" font-size="16" fill="#0f766e">immediately</text></g>
<g data-beat="4"><path d="M 150.00,456.00 L 250.00,408.00" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Reversibility_Budget)"/></g>
<g data-beat="4"><text x="40.00" y="489.40" font-size="16" fill="#b45309"><tspan x="40.00">the ONLY bucket that moves when the year goes wrong —</tspan><tspan x="40.00" dy="20.00">so every cut lands on the smallest bucket, and often the most valuable per dollar.</tspan><tspan x="40.00" dy="20.00">What gets cut is not what SHOULD be cut. It is what CAN be.</tspan></text></g>
<g data-beat="5"><rect x="40.00" y="568.00" width="1120.00" height="56.00" rx="14.0" ry="14.0" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/></g>
<g data-beat="5"><text x="600.00" y="601.23" font-size="19" fill="#1e1e1e" text-anchor="middle">Commitments are made on a FORECAST and paid on the ACTUAL.</text></g>
<g data-beat="5"><text x="600.00" y="657.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="600.00">And demand can cancel on you faster than supply can cancel on you: revenue falls immediately, costs fall slowly —</tspan><tspan x="600.00" dy="20.00">and the gap between those two speeds is exactly the size of the crisis.</tspan></text></g>
</svg>