<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Plan and Venture Capital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
      :root { --ink: #111827; --muted: #4b5563; --line: #d1d5db; --accent: #0f766e; --soft: #f3f4f6; }
      .reveal { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: #fff; }
      .reveal h1, .reveal h2, .reveal h3, .reveal h4 { text-transform: none; letter-spacing: 0; }
      .reveal h2 { font-size: 1.15em; font-weight: 700; line-height: 1.15; margin-bottom: 0.45em; }
      .reveal h3 { font-size: 0.72em; color: var(--accent); margin-bottom: 0.45em; }
      .reveal h4 { font-size: 0.58em; color: var(--muted); margin-bottom: 0.4em; }
      .reveal p, .reveal li { font-size: 0.48em; line-height: 1.45; color: var(--ink); }
      .reveal ul { margin: 0.35em 0 0 1.1em; }
      .reveal li { margin-bottom: 0.35em; }
      .title-slide h2 { font-size: 1.35em; }
      .subtitle { color: var(--muted); text-align: center; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; text-align: left; }
      .box { background: var(--soft); border-left: 6px solid var(--accent); padding: 18px 22px; text-align: left; }
      .question-slide li { list-style: none; margin-left: -1em; }
      .small { font-size: 0.42em; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section class="title-slide">

          
     TBD
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script>
      Reveal.initialize({ hash: true, slideNumber: true });
    </script>
  </body>
</html>
