<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 10.0 1166.0 660.0" width="1166" height="660" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-Take_Rate_Waterfall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><text x="40.00" y="50.20" font-size="18" fill="#0f766e">READ IT DOWNWARD — one subtraction at a time</text></g>
<g data-beat="1"><rect x="200.00" y="76.00" width="640.00" height="44.00" rx="11.0" ry="11.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="190.00" y="102.67" font-size="17" fill="#1971c2" text-anchor="end">VOLUME (GMV)</text></g>
<g data-beat="1"><text x="862.00" y="92.40" font-size="16" fill="#4b5563"><tspan x="862.00">100 ¢   ·   $36.7 billion of</tspan><tspan x="862.00" dy="20.00">other people&#x27;s purchases</tspan></text></g>
<g data-beat="2"><path d="M 222.00,126.00 L 222.00,164.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Take_Rate_Waterfall)"/></g>
<g data-beat="2"><text x="250.00" y="149.40" font-size="16" fill="#4b5563">your stated take rate — the one line that is a contract, not a process</text></g>
<g data-beat="2"><rect x="200.00" y="168.00" width="56.32" height="44.00" rx="11.0" ry="11.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="2"><text x="190.00" y="194.68" font-size="17" fill="#0f766e" text-anchor="end">REVENUE</text></g>
<g data-beat="2"><text x="862.00" y="184.40" font-size="16" fill="#4b5563"><tspan x="862.00">8.8 ¢   ·   the number people quote</tspan><tspan x="862.00" dy="20.00">in pitches, and the least interesting one</tspan></text></g>
<g data-beat="3"><path d="M 222.00,218.00 L 222.00,320.00" fill="none" stroke="#c92a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Take_Rate_Waterfall)"/></g>
<g data-beat="3"><text x="250.00" y="241.40" font-size="16" fill="#c92a2a">− credit losses</text></g>
<g data-beat="3"><text x="446.00" y="241.40" font-size="16" fill="#4b5563">(who you said yes to)</text></g>
<g data-beat="3"><text x="250.00" y="265.40" font-size="16" fill="#c92a2a">− processing</text></g>
<g data-beat="3"><text x="446.00" y="265.40" font-size="16" fill="#4b5563">(how you route the transaction)</text></g>
<g data-beat="3"><text x="250.00" y="289.40" font-size="16" fill="#c92a2a">− funding cost</text></g>
<g data-beat="3"><text x="446.00" y="289.40" font-size="16" fill="#4b5563">(where you borrowed)</text></g>
<g data-beat="3"><text x="250.00" y="313.40" font-size="16" fill="#c92a2a">− purchase / COGS</text></g>
<g data-beat="3"><text x="446.00" y="313.40" font-size="16" fill="#4b5563">(what the product actually costs)</text></g>
<g data-beat="3"><text x="862.00" y="258.38" font-size="15" fill="#4b5563"><tspan x="862.00">Not accounting entries.</tspan><tspan x="862.00" dy="18.75">Operations — and every one is a place</tspan><tspan x="862.00" dy="18.75">an operator beats an identical model.</tspan></text></g>
<g data-beat="4"><rect x="200.00" y="330.00" width="25.60" height="44.00" rx="6.4" ry="6.4" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="4"><text x="190.00" y="356.68" font-size="17" fill="#0f766e" text-anchor="end">CONTRIBUTION</text></g>
<g data-beat="4"><text x="862.00" y="346.40" font-size="16" fill="#4b5563"><tspan x="862.00">4.0 ¢   ·   revenue minus everything</tspan><tspan x="862.00" dy="20.00">that grows WITH volume</tspan></text></g>
<g data-beat="4"><text x="40.00" y="400.40" font-size="16" fill="#0f766e">Draw the line here. This is the number that tells you whether growth is worth having.</text></g>
<g data-beat="5"><path d="M 222.00,414.00 L 222.00,448.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Take_Rate_Waterfall)"/></g>
<g data-beat="5"><text x="250.00" y="435.40" font-size="16" fill="#4b5563">− technology · marketing · administration  (the fixed stack)</text></g>
<g data-beat="5"><rect x="200.00" y="452.00" width="5.00" height="44.00" rx="1.2" ry="1.2" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="5"><text x="190.00" y="478.68" font-size="17" fill="#b45309" text-anchor="end">PROFIT</text></g>
<g data-beat="5"><text x="862.00" y="468.40" font-size="16" fill="#4b5563"><tspan x="862.00">about 0.1 ¢   ·   $52 million — the first</tspan><tspan x="862.00" dy="20.00">ever, on $36.7 billion touched</tspan></text></g>
<g data-beat="5"><rect x="40.00" y="528.00" width="1118.00" height="60.00" rx="15.0" ry="15.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="5"><text x="599.00" y="562.95" font-size="18" fill="#1e1e1e" text-anchor="middle">A FIXED cost is a problem you can OUTGROW.  A VARIABLE cost is a problem you must OUT-OPERATE.</text></g>
<g data-beat="5"><text x="599.00" y="617.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="599.00">Double the volume and you double every variable slice with it. You do not grow out of a per-unit leak —</tspan><tspan x="599.00" dy="20.00">you grow deeper into it, faster, with more press coverage.</tspan></text></g>
</svg>