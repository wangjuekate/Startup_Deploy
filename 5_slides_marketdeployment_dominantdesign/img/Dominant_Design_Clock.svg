<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 56.0 1148.0 590.0" width="1148" height="590" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-Dominant_Design_Clock" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><rect x="40.00" y="80.00" width="340.00" height="292.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="1"><text x="210.00" y="127.00" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="210.00">GATE 1 · PRE-DOMINANCE</tspan><tspan x="210.00" dy="18.75">many designs, no winner</tspan><tspan x="210.00" dy="18.75"> </tspan><tspan x="210.00" dy="18.75">&quot;which architecture</tspan><tspan x="210.00" dy="18.75">do we bet on?&quot;</tspan><tspan x="210.00" dy="18.75"> </tspan><tspan x="210.00" dy="18.75">WIN BY:</tspan><tspan x="210.00" dy="18.75">optionality · fast iteration ·</tspan><tspan x="210.00" dy="18.75">reversible bets</tspan><tspan x="210.00" dy="18.75"> </tspan><tspan x="210.00" dy="18.75">do not over-commit capital</tspan><tspan x="210.00" dy="18.75">to one design</tspan></text></g>
<g data-beat="2"><path d="M 384.00,226.00 L 416.00,226.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Dominant_Design_Clock)"/></g>
<g data-beat="2"><rect x="420.00" y="80.00" width="340.00" height="292.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="2"><text x="590.00" y="108.25" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="590.00">GATE 2 · THE BATTLE</tspan><tspan x="590.00" dy="18.75">one design pulls ahead</tspan><tspan x="590.00" dy="18.75"> </tspan><tspan x="590.00" dy="18.75">installed base × complements</tspan><tspan x="590.00" dy="18.75">× switching costs</tspan><tspan x="590.00" dy="18.75"> </tspan><tspan x="590.00" dy="18.75">WIN BY:</tspan><tspan x="590.00" dy="18.75">adoption — even at the cost</tspan><tspan x="590.00" dy="18.75">of exclusivity. Open it.</tspan><tspan x="590.00" dy="18.75">Licence it. Subsidise</tspan><tspan x="590.00" dy="18.75">complements.</tspan><tspan x="590.00" dy="18.75"> </tspan><tspan x="590.00" dy="18.75">margin can wait;</tspan><tspan x="590.00" dy="18.75">the installed base cannot</tspan></text></g>
<g data-beat="3"><path d="M 764.00,226.00 L 796.00,226.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Dominant_Design_Clock)"/></g>
<g data-beat="3"><rect x="800.00" y="80.00" width="340.00" height="292.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="3"><text x="970.00" y="127.00" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="970.00">GATE 3 · POST-DOMINANCE</tspan><tspan x="970.00" dy="18.75">the design is settled</tspan><tspan x="970.00" dy="18.75"> </tspan><tspan x="970.00" dy="18.75">the product commoditizes;</tspan><tspan x="970.00" dy="18.75">the money moves UP A LAYER</tspan><tspan x="970.00" dy="18.75"> </tspan><tspan x="970.00" dy="18.75">WIN BY:</tspan><tspan x="970.00" dy="18.75">harvesting the commodity</tspan><tspan x="970.00" dy="18.75">efficiently — and standing</tspan><tspan x="970.00" dy="18.75">where the money went</tspan><tspan x="970.00" dy="18.75"> </tspan><tspan x="970.00" dy="18.75">then open the next Gate 1</tspan></text></g>
<g data-beat="4"><path d="M 1120.00,376.00 L 1120.00,420.00 L 210.00,420.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Dominant_Design_Clock)"/></g>
<g data-beat="4"><text x="590.00" y="453.68" font-size="17" fill="#4b5563" text-anchor="middle">Ask the question for EACH product line separately — you are usually at all three gates at once.</text></g>
<g data-beat="5"><rect x="40.00" y="486.00" width="1100.00" height="56.00" rx="14.0" ry="14.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="5"><text x="590.00" y="519.23" font-size="19" fill="#1e1e1e" text-anchor="middle">At Gate 2 you should GIVE AWAY the thing you would never give away at Gate 3.</text></g>
<g data-beat="5"><text x="590.00" y="573.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="590.00">Openness is a weapon while the standard is being decided, and a giveaway once it is settled —</tspan><tspan x="590.00" dy="20.00">same action, opposite value, and the only thing that changed was the gate.</tspan><tspan x="590.00" dy="20.00">And winning Gate 2 hands you a business that is about to commoditize: the victory and the margin compression are the SAME EVENT.</tspan></text></g>
</svg>