<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 16.0 1128.0 706.0" width="1128" height="706" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-Value_Metric_Triangle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><rect x="410.00" y="40.00" width="340.00" height="112.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="1"><text x="580.00" y="68.80" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="580.00">1 · THE METRIC</tspan><tspan x="580.00" dy="21.25">what you charge for</tspan><tspan x="580.00" dy="21.25">per seat · per unit · per outcome ·</tspan><tspan x="580.00" dy="21.25">per usage</tspan></text></g>
<g data-beat="1"><text x="580.00" y="200.40" font-size="16" fill="#0f766e" text-anchor="middle"><tspan x="580.00">THE TEST:</tspan><tspan x="580.00" dy="20.00">does this number get bigger when the</tspan><tspan x="580.00" dy="20.00">customer is getting more value?</tspan><tspan x="580.00" dy="20.00">yes → a growth engine.</tspan><tspan x="580.00" dy="20.00">no → a negotiation every renewal.</tspan></text></g>
<g data-beat="2"><path d="M 470.00,158.00 L 250.00,348.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="2"><rect x="60.00" y="352.00" width="340.00" height="108.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="2"><text x="230.00" y="389.43" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="230.00">2 · THE LEVEL</tspan><tspan x="230.00" dy="21.25">how much — price per unit,</tspan><tspan x="230.00" dy="21.25">discounts, commitments</tspan></text></g>
<g data-beat="2"><text x="230.00" y="493.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="230.00">bounded by the customer&#x27;s alternative</tspan><tspan x="230.00" dy="20.00">and your cost to serve — and the EASIEST</tspan><tspan x="230.00" dy="20.00">of the three to change later</tspan></text></g>
<g data-beat="3"><path d="M 690.00,158.00 L 910.00,348.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="3"><path d="M 404.00,406.00 L 756.00,406.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="3"><rect x="760.00" y="352.00" width="340.00" height="108.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="3"><text x="930.00" y="389.43" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="930.00">3 · THE FENCES</tspan><tspan x="930.00" dy="21.25">who pays more — tiers, editions,</tspan><tspan x="930.00" dy="21.25">segments, support, regions, volume</tspan></text></g>
<g data-beat="3"><text x="930.00" y="503.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="930.00">a single price for everyone is not fairness —</tspan><tspan x="930.00" dy="20.00">it is money left on both ends</tspan></text></g>
<g data-beat="4"><rect x="60.00" y="560.00" width="1040.00" height="58.00" rx="14.5" ry="14.5" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/></g>
<g data-beat="4"><text x="580.00" y="582.70" font-size="18" fill="#1e1e1e" text-anchor="middle"><tspan x="580.00">The LEVEL is easy to change and cheap to get wrong.</tspan><tspan x="580.00" dy="22.50">The METRIC is almost impossible to change, and it decides your entire company.</tspan></text></g>
<g data-beat="4"><text x="580.00" y="649.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="580.00">And a usage metric aligns you with your customer&#x27;s SUCCESS — and with your customer&#x27;s EFFICIENCY.</tspan><tspan x="580.00" dy="20.00">When the customer grows, you grow. When the customer optimizes, you shrink.</tspan><tspan x="580.00" dy="20.00">You signed up for both when you picked the metric, and you cannot have only the first half.</tspan></text></g>
</svg>