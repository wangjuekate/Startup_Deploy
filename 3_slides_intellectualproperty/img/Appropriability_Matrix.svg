<g data-beat="1"><path d="M 740.00,142.00 L 740.00,518.00" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="1"><path d="M 332.00,330.00 L 1148.00,330.00" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="1"><text x="537.50" y="127.67" font-size="17" fill="#4b5563" text-anchor="middle">NO — you would never know</text></g>
<g data-beat="1"><text x="942.50" y="127.67" font-size="17" fill="#4b5563" text-anchor="middle">YES — you could prove it</text></g>
<g data-beat="1"><text x="320.00" y="220.93" font-size="17" fill="#4b5563" text-anchor="end"><tspan x="320.00">YES</tspan><tspan x="320.00" dy="21.25">describing it</tspan><tspan x="320.00" dy="21.25">destroys it</tspan></text></g>
<g data-beat="1"><text x="320.00" y="405.93" font-size="17" fill="#4b5563" text-anchor="end"><tspan x="320.00">NO</tspan><tspan x="320.00" dy="21.25">disclosure is</tspan><tspan x="320.00" dy="21.25">fine, or required</tspan></text></g>
<g data-beat="1"><text x="740.00" y="92.22" font-size="19" fill="#1e1e1e" text-anchor="middle">CAN YOU DETECT INFRINGEMENT?</text></g>
<g data-beat="1"><text x="320.00" y="91.10" font-size="19" fill="#1e1e1e" text-anchor="end"><tspan x="320.00">DISCLOSURE</tspan><tspan x="320.00" dy="23.75">DESTROYS IT?</tspan></text></g>
<g data-beat="2"><rect x="340.00" y="150.00" width="395.00" height="175.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="2"><text x="537.50" y="185.38" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="537.50">TRADE SECRET</tspan><tspan x="537.50" dy="18.75">+ speed  + contracts</tspan><tspan x="537.50" dy="18.75"> </tspan><tspan x="537.50" dy="18.75">unreleased hardware, recipes,</tspan><tspan x="537.50" dy="18.75">negative know-how —</tspan><tspan x="537.50" dy="18.75">the secret and the surprise</tspan><tspan x="537.50" dy="18.75">are the same asset</tspan></text></g>
<g data-beat="3"><rect x="745.00" y="150.00" width="395.00" height="175.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="3"><text x="942.50" y="204.12" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="942.50">TRADE SECRET  or  PATENT</tspan><tspan x="942.50" dy="18.75">your call: term vs. secrecy</tspan><tspan x="942.50" dy="18.75"> </tspan><tspan x="942.50" dy="18.75">a process a rival would have</tspan><tspan x="942.50" dy="18.75">to advertise in order to use</tspan></text></g>
<g data-beat="4"><rect x="340.00" y="335.00" width="395.00" height="175.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="4"><text x="537.50" y="389.12" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="537.50">COPYRIGHT  /  TRADEMARK</tspan><tspan x="537.50" dy="18.75">expression, and identity</tspan><tspan x="537.50" dy="18.75"> </tspan><tspan x="537.50" dy="18.75">code, text, film, images,</tspan><tspan x="537.50" dy="18.75">the name on the door</tspan></text></g>
<g data-beat="5"><rect x="745.00" y="335.00" width="395.00" height="175.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="5"><text x="942.50" y="389.12" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="942.50">PATENT · COPYRIGHT · TRADEMARK</tspan><tspan x="942.50" dy="18.75">register it</tspan><tspan x="942.50" dy="18.75"> </tspan><tspan x="942.50" dy="18.75">you can actually enforce it —</tspan><tspan x="942.50" dy="18.75">buy the pill, test it, prove it</tspan></text></g>
<g data-beat="6"><rect x="170.00" y="552.00" width="970.00" height="56.00" rx="14.0" ry="14.0" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/></g>
<g data-beat="6"><text x="655.00" y="584.95" font-size="18" fill="#1e1e1e" text-anchor="middle">You can decide to publish a secret. You can never decide to un-publish one.</text></g>
<g data-beat="6"><text x="655.00" y="637.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="655.00">And the most valuable thing you own is in none of the four boxes: the twenty people who learned,</tspan><tspan x="655.00" dy="20.00">over a decade, which approaches do NOT work. It walks out at five o&#x27;clock and comes back voluntarily —</tspan><tspan x="655.00" dy="20.00">until one day it does not. Only a contract and a culture touch it.</tspan></text></g>
</svg>